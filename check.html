:root{--ink:#141414;--mid:#5c5c58;--rule:#d3d3cd;--paper:#fff;--desk:#e9e8e4;--blue:#23408e;--ok:#1f6b45;--warn:#8a5300;--no:#a8211b}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--desk);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{padding:28px 16px 48px}
.num{font-family:"QOswald","Oswald","Arial Narrow",sans-serif;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}
main{max-width:880px;margin:0 auto;background:var(--paper);padding:0 40px 32px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:30px 0 14px;border-bottom:3px solid var(--ink)}
header .brand{font-size:44px;line-height:1}
h1{font-size:15px;font-weight:600;margin-top:6px}
header .when{text-align:right;font-size:13px;color:var(--mid)}
header .when .num{font-size:17px;color:var(--ink);margin-left:6px}
#when{display:block;margin-left:0}
header .when #when{margin-left:0}
/* 打樣條：這一條是用顯示卡即時畫出來的 */
.proof{display:block;width:100%;height:44px;background:#f1f1ee}
.proofnote{display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--mid);padding:6px 0 0}
.verdict{padding:30px 0 26px;border-bottom:1px solid var(--ink)}
.verdict b{display:block;font-size:52px;line-height:1.2;font-weight:800;letter-spacing:.04em;color:var(--mid);text-wrap:balance}
.verdict p{margin-top:8px;max-width:38em}
.verdict[data-s=ok] b{color:var(--ok)}
.verdict[data-s=warn] b{color:var(--warn)}
.verdict[data-s=no] b{color:var(--no)}
table{width:100%;border-collapse:collapse}
caption{text-align:left;font-weight:700;padding:26px 0 8px;border-bottom:1px solid var(--ink)}
th,td{text-align:left;vertical-align:top;padding:11px 14px 11px 0;border-bottom:1px solid var(--rule)}
thead th{font-size:13px;font-weight:500;color:var(--mid);padding-top:7px;padding-bottom:7px}
tbody th{font-weight:600;width:22%}
td.got{width:26%;overflow-wrap:anywhere}
td.need{width:38%;color:var(--mid);font-size:13px;line-height:1.55}
td.res{width:14%;padding-right:0;text-align:right;font-weight:700;white-space:nowrap;color:var(--mid)}
tr[data-s=ok] td.res{color:var(--ok)}
tr[data-s=warn] td.res{color:var(--warn)}
tr[data-s=no] td.res{color:var(--no)}
tr[data-s=run] td.res{animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
td .why{display:block;margin-top:4px;color:var(--ink)}
.report{padding-top:30px}
.report h2{font-size:15px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.report p{margin:12px 0}
.report textarea{width:100%;height:190px;resize:vertical;border:1px solid var(--rule);padding:10px 12px;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:#fafaf8}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;font-weight:600;border:1px solid var(--blue);background:var(--blue);color:#fff;padding:9px 20px;cursor:pointer}
button.ghost{background:#fff;color:var(--blue)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid #e2a400;outline-offset:2px}
footer{margin-top:30px;padding-top:12px;border-top:3px solid var(--ink);font-size:13px;color:var(--mid)}
.nojs{margin:24px 0;padding:16px 18px;border:2px solid var(--no);color:var(--no);font-weight:700}
@media (max-width:640px){
  body{padding:0}
  main{padding:0 18px 28px}
  header{flex-direction:column;align-items:flex-start;gap:8px}
  header .when{text-align:left}
  .verdict b{font-size:34px}
  thead{display:none}
  table,tbody,caption{display:block}
  tbody tr{display:grid;grid-template-columns:1fr auto;padding:12px 0;border-bottom:1px solid var(--rule)}
  tbody th,tbody td{display:block;width:auto!important;border:0;padding:0}
  tbody th{grid-column:1;grid-row:1}
  td.res{grid-column:2;grid-row:1}
  td.got,td.need{grid-column:1/-1;margin-top:4px}
}
@media (prefers-reduced-motion:reduce){tr[data-s=run] td.res{animation:none}}
</style>
</head>

<header>

  <div class="when">檢測版本 <span class="num">1.0</span><span class="num" id="when"></span></div>

<script>
(function () {
'use strict';
var VERSION = '1.0';

// 門檻。改支援環境時只改這裡。
var NEED = {
  browser: { Chrome: 111, Edge: 111, Safari: 16.2, Firefox: 113 },
  texOk: 8192, texMin: 4096,          // 貼圖邊長上限
  uniOk: 512, uniMin: 350,            // 片段著色器參數容量
  compileSec: 8,                      // 大型著色器準備時間（秒）超過就提醒
  frameMs: 28                         // 每一格繪圖時間（毫秒）超過就提醒
};
var WORD = { ok: '通過', warn: '注意', no: '不支援', run: '檢測中', skip: '無法檢測', wait: '等待中' };

var $ = function (id) { return document.getElementById(id); };
var rows = [];

function row(table, id, name, need) {
  var tr = document.createElement('tr');
  var th = document.createElement('th'); th.scope = 'row'; th.textContent = name;
  var got = document.createElement('td'); got.className = 'got'; got.textContent = '—';
  var nd = document.createElement('td'); nd.className = 'need'; nd.textContent = need;
  var res = document.createElement('td'); res.className = 'res'; res.textContent = WORD.wait;
  tr.append(th, got, nd, res); $(table).appendChild(tr);
  var r = {
    id: id, name: name, state: 'wait', got: '—', why: '',
    run: function () { r.state = 'run'; tr.dataset.s = 'run'; res.textContent = WORD.run; },
    set: function (state, value, why) {
      r.state = state; r.got = value; r.why = why || '';
      tr.dataset.s = state; res.textContent = WORD[state]; got.textContent = value;
      if (why) { var s = document.createElement('span'); s.className = 'why'; s.textContent = why; got.appendChild(s); }
    }
  };
  rows.push(r); return r;
}

var pause = function (ms) { return new Promise(function (ok) { setTimeout(ok, ms || 60); }); };
var visible = function () {
  if (!document.hidden) return Promise.resolve();
  return new Promise(function (ok) {
    var f = function () { if (!document.hidden) { document.removeEventListener('visibilitychange', f); ok(); } };
    document.addEventListener('visibilitychange', f);
  });
};

// ---------- 裝置與瀏覽器 ----------
function readBrowser() {
  var u = navigator.userAgent, m;
  var iPad = /Macintosh/.test(u) && navigator.maxTouchPoints > 1;
  var mobile = iPad || /Android|iPhone|iPad|iPod|Mobile/i.test(u);
  var os = iPad || /iPad/.test(u) ? 'iPadOS' : /iPhone|iPod/.test(u) ? 'iOS' : /Android/.test(u) ? 'Android'
    : /Windows NT 10/.test(u) ? 'Windows 10／11' : /Windows/.test(u) ? '舊版 Windows' : /CrOS/.test(u) ? 'ChromeOS'
    : /Mac OS X|Macintosh/.test(u) ? 'macOS' : /Linux/.test(u) ? 'Linux' : '無法辨認';
  var name = null, ver = null, shown = '';
  if ((m = u.match(/(?:Edg|EdgA|EdgiOS)\/(\d+)/))) { name = 'Edge'; ver = +m[1]; }
  else if ((m = u.match(/(?:Firefox|FxiOS)\/(\d+)/))) { name = 'Firefox'; ver = +m[1]; }
  else if ((m = u.match(/(?:Chrome|CriOS)\/(\d+)/))) { name = 'Chrome'; ver = +m[1]; if (/OPR\//.test(u)) shown = 'Opera（Chrome 核心 ' + ver + '）'; }
  else if ((m = u.match(/Version\/(\d+(?:\.\d+)?).*Safari/))) { name = 'Safari'; ver = parseFloat(m[1]); }
  return { mobile: mobile, os: os, name: name, ver: ver, label: shown || (name ? name + ' ' + ver : '無法辨認的瀏覽器') };
}

function canvasBlurWorks() {
  try {
    var c = document.createElement('canvas'); c.width = c.height = 40;
    var g = c.getContext('2d', { willReadFrequently: true });
    g.filter = 'blur(4px)'; g.fillStyle = '#000'; g.fillRect(12, 12, 16, 16);
    return g.getImageData(9, 20, 1, 1).data[3] > 4;
  } catch (e) { return false; }
}

// ---------- WebGL 小工具 ----------
var VS = '#version 300 es\nvoid main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.-1.,0.,1.);}';

function startProgram(gl, fs) {
  var p = gl.createProgram();
  [[gl.VERTEX_SHADER, VS], [gl.FRAGMENT_SHADER, fs]].forEach(function (s) {
    var sh = gl.createShader(s[0]); gl.shaderSource(sh, s[1]); gl.compileShader(sh); gl.attachShader(p, sh);
  });
  gl.linkProgram(p); return p;
}
function linked(gl, p) { return gl.getProgramParameter(p, gl.LINK_STATUS); }

// ---------- 打樣條：色塊＋漸層＋細線，畫完讀回顏色確認畫對了 ----------
function drawProof(gl) {
  var p = startProgram(gl, '#version 300 es\nprecision highp float;out vec4 o;uniform vec2 R;\n'
    + 'void main(){vec2 u=gl_FragCoord.xy/R;vec3 c;\n'
    + 'if(u.x<.42){int i=int(u.x/.06);vec3 k[7]=vec3[7](vec3(0.,.682,.937),vec3(.925,0.,.549),vec3(1.,.949,0.),vec3(.08),vec3(.93,.11,.14),vec3(0.,.65,.32),vec3(.18,.19,.57));c=k[i];}\n'
    + 'else if(u.x<.72){float t=(u.x-.42)/.3;c=u.y>.5?vec3(t):mix(vec3(.137,.251,.557),vec3(1.),t);}\n'
    + 'else{float t=(u.x-.72)/.28;float f=mix(18.,3.,t);c=vec3(step(.5,fract((gl_FragCoord.x+(u.y>.5?0.:gl_FragCoord.y))/f)));c=mix(vec3(.08),vec3(1.),c.x);}\n'
    + 'o=vec4(c,1.);}');
  if (!linked(gl, p)) return false;
  gl.useProgram(p); gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
  gl.uniform2f(gl.getUniformLocation(p, 'R'), gl.canvas.width, gl.canvas.height);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  var px = new Uint8Array(4);
  gl.readPixels(Math.floor(gl.canvas.width * .03), 20, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.deleteProgram(p);
  return px[0] < 30 && px[1] > 150 && px[2] > 210;
}

function floatTargetWorks(gl) {
  if (!gl.getExtension('EXT_color_buffer_float')) return false;
  return [gl.RGBA16F, gl.RGBA32F].every(function (fmt) {
    var t = gl.createTexture(), f = gl.createFramebuffer();
    gl.bindTexture(gl.TEXTURE_2D, t); gl.texStorage2D(gl.TEXTURE_2D, 1, fmt, 16, 16);
    gl.bindFramebuffer(gl.FRAMEBUFFER, f); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(f); gl.deleteTexture(t);
    return ok;
  });
}

// ---------- 試跑一：大型著色器（內容是隨機產生的算式，只為了量準備時間） ----------
function bigShader() {
  var seed = (Math.random() * 1e9) | 0;
  var rnd = function () { seed = (seed * 48271) % 2147483647; if (seed <= 0) seed += 2147483646; return (seed % 100000) / 100000; };
  var k = function () { return (rnd() * 4 + .1).toFixed(5); };
  var body = '', calls = '', n = 0;
  while (body.length < 30000) {
    body += 'vec3 f' + n + '(vec3 p,vec4 q){vec3 a=p*' + k() + '+q.xyz;for(int i=0;i<3;i++){a+=sin(a.yzx*' + k() + '+q.w);a=mix(a,abs(a.zxy)-' + k()
      + ',.35);a*=1.+.02*cos(dot(a,vec3(' + k() + ',' + k() + ',' + k() + ')));}a+=texture(s' + (n % 16) + ',a.xy*.1).rgb;return fract(a*' + k() + ');}\n';
    calls += 'if(uOn>' + n + '.5)c=f' + n + '(c,uP[(' + n + '+uOff)%330]);\n';
    n++;
  }
  var samplers = ''; for (var i = 0; i < 16; i++) samplers += 'uniform sampler2D s' + i + ';';
  return '#version 300 es\nprecision highp float;precision highp int;out vec4 o;uniform vec4 uP[330];uniform float uOn;uniform int uOff;'
    + samplers + '\n' + body + 'void main(){vec3 c=gl_FragCoord.xyz*.01;\n' + calls + 'o=vec4(c,1.);}';
}

async function timeCompile(gl) {
  var ext = gl.getExtension('KHR_parallel_shader_compile');
  var src = bigShader();
  var t0 = performance.now();
  var p = startProgram(gl, src);
  if (ext) {
    while (!gl.getProgramParameter(p, ext.COMPLETION_STATUS_KHR)) {
      if (gl.isContextLost()) return { lost: true };
      if (performance.now() - t0 > 60000) return { timeout: true };
      await pause(50);
    }
  }
  if (gl.isContextLost()) return { lost: true };
  if (!linked(gl, p)) return { fail: (gl.getProgramInfoLog(p) || '').slice(0, 200) };
  gl.useProgram(p); gl.uniform1f(gl.getUniformLocation(p, 'uOn'), 1); gl.viewport(0, 0, 1, 1);
  gl.drawArrays(gl.TRIANGLES, 0, 3);   // 有些顯示卡要真的畫一次才會編譯完
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
  var sec = (performance.now() - t0) / 1000;
  gl.deleteProgram(p);
  return { sec: sec };
}

// ---------- 試跑二：每一格繪圖時間（固定的通用運算量，畫在 1280×800） ----------
async function timeFrames(gl) {
  var p = startProgram(gl, '#version 300 es\nprecision highp float;out vec4 o;uniform float T;\n'
    + 'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}\n'
    + 'float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}\n'
    + 'void main(){vec2 p=gl_FragCoord.xy*.008;float v=0.;for(int i=0;i<48;i++){float fi=float(i);v+=nz(p*(1.+fi*.07)+vec2(T,fi))/48.;p+=.03*vec2(sin(v*6.+fi),cos(v*5.-fi));}o=vec4(vec3(v),1.);}');
  if (!linked(gl, p)) return null;
  var W = 1280, H = 800;
  var tex = gl.createTexture(), fb = gl.createFramebuffer(), px = new Uint8Array(4);
  gl.bindTexture(gl.TEXTURE_2D, tex); gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, W, H);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb); gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.useProgram(p);
  var T = gl.getUniformLocation(p, 'T');
  var draw = function (w, h, i) {
    gl.viewport(0, 0, w, h); gl.uniform1f(T, i * .13); gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  };
  draw(64, 40, 0);   // 暖機
  var t = performance.now(); draw(320, 200, 1); var small = performance.now() - t;
  // 很慢的機器不跑整張，避免顯示卡被系統重置
  if (small * 16 > 400) { gl.deleteFramebuffer(fb); gl.deleteTexture(tex); gl.deleteProgram(p); return { ms: small * 16, rough: true }; }
  var times = [], start = performance.now();
  for (var i = 0; i < 30 && (i < 6 || performance.now() - start < 1500); i++) {
    await visible(); await pause(0);
    if (gl.isContextLost()) return { lost: true };
    t = performance.now(); draw(W, H, i); times.push(performance.now() - t);
  }
  times.sort(function (a, b) { return a - b; });
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fb); gl.deleteTexture(tex); gl.deleteProgram(p);
  return { ms: times[times.length >> 1] };
}

// ---------- 主流程 ----------
var busy = false, lost = false;
async function main() {
  if (busy) return; busy = true;
  rows = []; ['tEnv', 'tGpu', 'tRun'].forEach(function (t) { $(t).textContent = ''; });
  $('copy').disabled = $('again').disabled = true;
  $('verdict').removeAttribute('data-s'); $('vTitle').textContent = '檢測中';
  $('vText').textContent = '大約需要幾秒到半分鐘，請讓這個分頁保持在畫面上。';
  $('report').value = '檢測中……';
  var now = new Date(), two = function (n) { return String(n).padStart(2, '0'); };
  var stamp = now.getFullYear() + '.' + two(now.getMonth() + 1) + '.' + two(now.getDate()) + ' ' + two(now.getHours()) + ':' + two(now.getMinutes());
  $('when').textContent = stamp;

  var rDev = row('tEnv', 'device', '裝置', '筆電或桌上型電腦。手機與平板不在支援範圍');
  var rBr = row('tEnv', 'browser', '瀏覽器', '建議 Chrome／Edge 111 或 Firefox 113 以上，不建議使用 Safari');
  var rBlur = row('tEnv', 'blur', '柔邊繪圖', '影子與部分工藝的柔邊效果');
  var rGl = row('tGpu', 'webgl2', 'WebGL2', '必要。手帳互動靠它繪圖');
  var rHw = row('tGpu', 'hw', '硬體加速', '必要。沒有顯示卡的虛擬機、遠端桌面不支援');
  var rTex = row('tGpu', 'tex', '圖片尺寸上限', NEED.texOk + ' 以上。大型場景工藝使用');
  var rUni = row('tGpu', 'uni', '運算參數容量', NEED.uniOk + ' 以上');
  var rFloat = row('tGpu', 'float', '浮點貼圖', '「活墨水」工藝必要');
  var rComp = row('tRun', 'compile', '特效準備時間', NEED.compileSec + ' 秒以內');
  var rFps = row('tRun', 'frame', '繪圖速度', '每格 ' + NEED.frameMs + ' 毫秒以內');

  var br = readBrowser();
  lost = false;
  rDev.set(br.mobile ? 'no' : 'ok', br.os + (br.mobile ? '（手機或平板）' : '（電腦）'),
    br.mobile ? '請改用筆電或桌上型電腦。' : '');
  var modern = !!(window.CSS && CSS.supports && CSS.supports('color', 'color-mix(in srgb, red, blue)'));
  if (br.name && br.ver < NEED.browser[br.name]) rBr.set('no', br.label, '版本太舊，請更新瀏覽器。');
  else if (!modern) rBr.set('no', br.label, '缺少需要的網頁功能，請更新或更換瀏覽器。');
  else if (br.name === 'Safari') rBr.set('warn', br.label, '不建議使用 Safari，請改用 Chrome 或 Edge。');
  else if (!br.name) rBr.set('warn', br.label, '不在列出的瀏覽器裡，建議改用 Chrome。');
  else rBr.set('ok', br.label);
  if (canvasBlurWorks()) rBlur.set('ok', '可以使用');
  else rBlur.set('warn', '不支援', '影子邊緣可能變硬，建議改用 Chrome 或 Edge。');

  await pause(120);

  var info = { renderer: '—', limits: '—' };
  var proof = $('proof');
  var fresh = proof.cloneNode(false); proof.replaceWith(fresh); proof = fresh;
  rGl.run();
  var gl = null;
  try { gl = proof.getContext('webgl2', { preserveDrawingBuffer: true }); } catch (e) { /* 當作沒有 */ }

  if (!gl) {
    rGl.set('no', '無法啟用', '請確認瀏覽器已開啟硬體加速，並更新顯示卡驅動程式。');
    [rHw, rTex, rUni, rFloat, rComp, rFps].forEach(function (r) { r.set('skip', '需要 WebGL2'); });
    $('proofText').textContent = '色條沒有畫出來：顯示卡繪圖無法啟用';
  } else {
    proof.addEventListener('webglcontextlost', function (e) { e.preventDefault(); lost = true; });
    var drawn = drawProof(gl);
    if (drawn) rGl.set('ok', '可以使用');
    else rGl.set('no', '可以啟用，但畫面不正確', '請更新顯示卡驅動程式。');
    $('proofText').textContent = drawn ? '上面這條由你的顯示卡即時繪製' : '色條沒有正確畫出來';
    await pause(120);

    var dbg = gl.getExtension('WEBGL_debug_renderer_info');
    var ren = String(gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || '瀏覽器未提供');
    info.renderer = ren;
    var strict = null;
    try { strict = document.createElement('canvas').getContext('webgl2', { failIfMajorPerformanceCaveat: true }); } catch (e) { /* 同上 */ }
    if (/swiftshader|llvmpipe|softpipe|software|basic render/i.test(ren) || !strict) rHw.set('no', ren, '目前是用處理器模擬繪圖。請開啟瀏覽器的硬體加速，或換一台電腦。');
    else if (/vmware|svga3d|virtualbox|parallels|virgl|virtio|qxl/i.test(ren)) rHw.set('warn', ren, '看起來是虛擬機的顯示卡，可能出現錯誤或卡頓。');
    else rHw.set('ok', ren);
    if (strict) { var lose = strict.getExtension('WEBGL_lose_context'); if (lose) lose.loseContext(); }

    var tex = gl.getParameter(gl.MAX_TEXTURE_SIZE), uni = gl.getParameter(gl.MAX_FRAGMENT_UNIFORM_VECTORS);
    info.limits = '貼圖 ' + tex + '、參數 ' + uni + '、貼圖單元 ' + gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS);
    rTex.set(tex >= NEED.texOk ? 'ok' : tex >= NEED.texMin ? 'warn' : 'no', String(tex),
      tex >= NEED.texOk ? '' : tex >= NEED.texMin ? '部分大型場景工藝可能無法顯示。' : '多數作品可能無法正確顯示。');
    rUni.set(uni >= NEED.uniOk ? 'ok' : uni >= NEED.uniMin ? 'warn' : 'no', String(uni),
      uni >= NEED.uniOk ? '' : uni >= NEED.uniMin ? '部分工藝可能無法顯示。' : '主要的工藝效果無法顯示。');
    var flt = floatTargetWorks(gl), lin = !!gl.getExtension('OES_texture_float_linear');
    if (flt && lin) rFloat.set('ok', '可以使用');
    else rFloat.set('warn', flt ? '部分支援' : '不支援', '「活墨水」可能無法使用，其他光影效果可能打折。');

    if (rows.some(function (r) { return r.state === 'no'; })) {
      // 已經確定不支援就不試跑（用處理器模擬繪圖時試跑會非常久）
      [rComp, rFps].forEach(function (r) { r.set('skip', '前面有項目沒有通過，略過'); });
    } else {
      await visible();
      var work = document.createElement('canvas'); work.width = work.height = 1;
      var g2 = work.getContext('webgl2');
      var released = false;
      work.addEventListener('webglcontextlost', function (e) { e.preventDefault(); if (!released) lost = true; });
      rComp.run(); await pause(200);
      try {
        var c = g2 ? await timeCompile(g2) : { lost: true };
        if (c.lost) rComp.set('warn', '顯示卡在測試中重置', '開啟作品時可能當掉。');
        else if (c.timeout) rComp.set('warn', '超過 60 秒', '開啟作品時要等很久。');
        else if (c.fail !== undefined) rComp.set('warn', '大型特效準備失敗', '部分作品可能打不開。');
        else rComp.set(c.sec <= NEED.compileSec ? 'ok' : 'warn', c.sec.toFixed(1) + ' 秒', c.sec <= NEED.compileSec ? '' : '開啟作品時要等比較久。');
      } catch (e) { rComp.set('warn', '測試中斷', String(e && e.message || e)); }
      rFps.run(); await pause(200);
      try {
        var f = g2 && !g2.isContextLost() ? await timeFrames(g2) : { lost: true };
        if (!f) rFps.set('warn', '測試畫面無法建立');
        else if (f.lost) rFps.set('warn', '顯示卡在測試中重置', '操作作品時可能當掉。');
        else rFps.set(f.ms <= NEED.frameMs ? 'ok' : 'warn', (f.rough ? '約 ' : '') + '每格 ' + (f.ms < 10 ? f.ms.toFixed(1) : Math.round(f.ms)) + ' 毫秒',
          f.ms <= NEED.frameMs ? '' : '操作作品時可能會卡頓。接上電源、關掉其他分頁後可再測一次。');
      } catch (e) { rFps.set('warn', '測試中斷', String(e && e.message || e)); }
      var done = g2 && g2.getExtension('WEBGL_lose_context'); if (done) { released = true; done.loseContext(); }   // 重新檢測時不累積繪圖資源
    }
  }

  var bad = rows.filter(function (r) { return r.state === 'no'; });
  var meh = rows.filter(function (r) { return r.state === 'warn'; });
  var names = function (a) { return a.map(function (r) { return r.name; }).join('、'); };
  var state = bad.length ? 'no' : meh.length || lost ? 'warn' : 'ok';
  var title = { ok: '符合支援環境', warn: '可以嘗試，有項目要注意', no: '不在支援環境' }[state];
  var text = state === 'ok' ? '這台裝置通過了全部檢測項目。'
    : state === 'warn' ? '注意項目：' + (names(meh) || '顯示卡在測試中重置') + '。委託前請把下方報告傳給創作者確認。'
    : '沒有通過：' + names(bad) + '。照表格裡的建議處理後，可以重新檢測。';
  $('verdict').dataset.s = state; $('vTitle').textContent = title; $('vText').textContent = text;

  var lines = ['CyberPrint 環境檢測 ' + VERSION + '｜' + stamp, '結果：' + title, ''];
  rows.forEach(function (r) { lines.push('[' + WORD[r.state] + '] ' + r.name + '：' + r.got); });
  if (lost) lines.push('顯示卡在檢測中曾經重置');
  lines.push('', '顯示卡：' + info.renderer, '上限：' + info.limits,
    '螢幕：' + screen.width + '×' + screen.height + '，縮放 ' + (window.devicePixelRatio || 1),
    '瀏覽器識別：' + navigator.userAgent);
  $('report').value = lines.join('\n');
  $('copy').disabled = $('again').disabled = false;
  busy = false;
}

$('copy').addEventListener('click', function () {
  var t = $('report'), b = this;
  var done = function (ok) { b.textContent = ok ? '已複製' : '請手動選取複製'; setTimeout(function () { b.textContent = '複製報告'; }, 2500); };
  var old = function () { t.focus(); t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) { /* 手動複製 */ } done(ok); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(function () { done(true); }, old);
  else old();
});
function start() { main().catch(function (e) {
  busy = false;
  $('verdict').dataset.s = 'warn'; $('vTitle').textContent = '檢測沒有完成';
  $('vText').textContent = '請把這一頁截圖傳給創作者。';
  $('report').value = '檢測中斷：' + (e && e.message || e) + '\n' + navigator.userAgent;
  $('copy').disabled = $('again').disabled = false;
}); }
$('again').addEventListener('click', start);
start();
})();
</script>
</body>
